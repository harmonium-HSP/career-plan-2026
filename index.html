<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>以实干筑基向智能而行</title>
  <link rel="stylesheet" href="vendor/lenis.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="startup-wall" id="startup-wall" aria-hidden="true"></div>
  <div class="curtain" id="curtain" hidden></div>

  <main id="home" class="home">
    <img class="campus" src="assets/campus.jpg" alt="">
    <div class="campus-shade" aria-hidden="true"></div>

    <p class="slogan" id="slogan"></p>

    <div class="stage" id="stage">
      <div class="card-clip" id="card-clip">
        <div class="card-track" id="card-track"></div>
        <button class="enter" id="enter" type="button">
          <span class="enter-name"><span id="home-name"></span></span>
        </button>
      </div>
    </div>

    <p class="home-sentence" id="home-sentence"></p>
    <p class="home-contest" id="home-contest"></p>
    <p class="home-meta" id="home-meta"></p>

    <div class="switcher">
      <p class="count" id="count"></p>
      <div class="thumbs" id="thumbs"></div>
    </div>
  </main>

  <div id="chapter" class="chapter" hidden>
    <button class="back" id="back" type="button">返回</button>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div id="beats"></div>
    <nav class="rail" id="rail" aria-label="这一章的页面"></nav>
  </div>

  <button class="side-plus side-prev" id="prev" type="button" aria-label="上一章">
    <span class="plus-arm plus-arm-x"></span>
    <span class="plus-arm plus-arm-y"></span>
  </button>
  <button class="side-plus side-next" id="next" type="button" aria-label="下一章">
    <span class="plus-arm plus-arm-x"></span>
    <span class="plus-arm plus-arm-y"></span>
  </button>
  <div class="dock" id="dock"></div>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="vendor/lenis.min.js"></script>
  <script src="content.js"></script>
  <script src="startup-wall.js"></script>
  <script src="bend-math.js"></script>
  <script src="bend-shader.js"></script>
  <script src="bend-view.js"></script>
  <script src="ascii-title-sweep.js"></script>
  <script src="cover-glitch.js"></script>
  <script src="main.js"></script>
</body>
</html>
